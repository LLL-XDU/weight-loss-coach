<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<title>减脂督导</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
<header id="topbar"><h1>减脂督导</h1></header>
<main id="view">加载中…</main>
<nav id="tabbar">
  <button data-tab="today" class="active">今日</button>
  <button data-tab="meals">三餐</button>
  <button data-tab="runs">乐跑</button>
  <button data-tab="weight">体重</button>
  <button data-tab="timetable">课表</button>
  <button data-tab="settings">设置</button>
</nav>
<script>
window.addEventListener("error", (e) => {
  const v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="card"><h2>出错了</h2><div class="muted">' + e.message + '</div></div>';
});
window.addEventListener("unhandledrejection", (e) => {
  const v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="card"><h2>出错了</h2><div class="muted">' + (e.reason && e.reason.message || e.reason) + '</div></div>';
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
